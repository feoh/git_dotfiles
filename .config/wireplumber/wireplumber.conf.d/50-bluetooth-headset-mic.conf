# Sennheiser MOMENTUM 4 headset microphone reliability (added 2026-10-02).
#
# Goal: use the headset mic on Zoom calls (headset switches A2DP -> HFP when an
# app records) without the HFP/SCO link failing part-way into the call.
#
# Findings on this machine (Intel AX211 + MOMENTUM 4, PipeWire 1.6.x,
# WirePlumber 0.5.18):
#   * Zoom opens and closes capture devices several times while starting up.
#     WirePlumber's default waits only 2 s after the last capture stream closes
#     before flipping the headset back to A2DP, so the headset was being
#     whiplashed HFP -> A2DP -> HFP within seconds. The kernel logged
#     "SCO packet for unknown connection handle" and WirePlumber logged
#     "Failure in Bluetooth audio transport" right after those flips, leaving
#     the headset output node in an error state (call connects, no audio).
#   * Fix: ~/.local/share/wireplumber/scripts/device/autoswitch-bluetooth-profile.lua
#     is a copy of the packaged script with PROFILE_RESTORE_TIMEOUT_MSEC raised
#     from 2000 to 20000. Re-copy and re-apply that one-line change after
#     WirePlumber upgrades that touch the script.
#   * USB autosuspend on the Bluetooth controller is disabled via
#     /etc/udev/rules.d/50-intel-bluetooth-no-autosuspend.rules and
#     /etc/modprobe.d/btusb-no-autosuspend.conf.
#
# If the HFP link still drops, the next lever is to disable the mSBC wideband
# codec and fall back to CVSD (lower voice quality, more robust):
#   monitor.bluez.properties = { bluez5.enable-msbc = false }
wireplumber.settings = {
  bluetooth.autoswitch-to-headset-profile = true
}
